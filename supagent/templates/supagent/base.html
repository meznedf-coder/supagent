<!doctype html>
<html lang="en" data-theme="light" data-superset-dark="{{ 'yes' if nav.theme.dark else 'no' }}"
      data-primary="{{ nav.theme.primary or '' }}" data-primary-dark="{{ nav.theme.primary_dark or '' }}">
<head>
<meta charset="utf-8">
<script src="{{ url_for('supagent_static.static', filename='theme.js') }}"{% if csp_nonce is defined %} nonce="{{ csp_nonce() }}"{% endif %}></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="csrf-token" content="{{ csrf_token() if csrf_token is defined else '' }}">
<title>{% block title %}Chat{% endblock %} · Superset</title>
<link rel="stylesheet" href="{{ url_for('supagent_static.static', filename='supagent.css') }}">
</head>
<body data-page="{{ nav.active }}" data-admin="{{ 'yes' if nav.is_admin else 'no' }}"
      data-chat-api="{{ url_for('ChatView.index') }}api/"
      data-dictionary-api="{{ url_for('KnowledgeView.index') }}api/"
      data-admin-api="{{ url_for('AdminView.index') }}api/"
      data-dictionary-url="{{ url_for('KnowledgeView.index') }}">
<header class="topbar">
  <a class="brand" href="/" title="Back to Superset">Superset</a>
  <span class="sep" aria-hidden="true"></span>
  <nav class="tabs" aria-label="Chat">
    {% if nav.can_chat %}<a href="{{ url_for('ChatView.index') }}" class="{{ 'on' if nav.active == 'chat' }}">Chat</a>{% endif %}
    {% if nav.can_dictionary %}<a href="{{ url_for('KnowledgeView.index') }}" class="{{ 'on' if nav.active == 'dictionary' }}">Data dictionary</a>{% endif %}
    {% if nav.is_admin %}<a href="{{ url_for('AdminView.index') }}" class="{{ 'on' if nav.active == 'admin' }}">Settings</a>{% endif %}
  </nav>
  <span class="grow"></span>
  <span class="who" title="The agent acts with this account's permissions">{{ nav.user }}</span>
</header>
<main class="page page-{{ nav.active }}">
{% block content %}{% endblock %}
</main>
<script src="{{ url_for('supagent_static.static', filename='common.js') }}"{% if csp_nonce is defined %} nonce="{{ csp_nonce() }}"{% endif %}></script>
{% block scripts %}{% endblock %}
</body>
</html>
